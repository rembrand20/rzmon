name: RzMon Agent
version: "1.59.2"
slug: rzmon_agent
description: Stuurt CPU, RAM, diskruimte, add-ons en containers, updates, back-ups, integraties, systeemstatus, herstarts, SD-kaart, USB-apparaten, logs, poorten en certificaten van Home Assistant naar RzMon
url: https://github.com/rembrand20/rzmon
arch:
  - aarch64
  - amd64
  - armv7
init: false
startup: services
boot: auto
# Supervisor API (alleen lezen): host-info, add-ons, updates, en voor "manager" ook de statistieken per
# container, de logs (OS, Core, Supervisor, add-ons) en de hardware (USB-apparaten)
hassio_api: true
hassio_role: manager
# Controleren of Home Assistant Core draait
homeassistant_api: true
# Nodig om de luisterende poorten van de host te zien
host_network: true
# Certificaten in /ssl (bv. van de Let's Encrypt- of DuckDNS-add-on) alleen lezen
map:
  - ssl
options:
  monitor_url: "http://192.168.1.10"
  pair_code: ""
  token: ""
  interval: 60
  verify_ssl: true
  certs:
    - /ssl/fullchain.pem
schema:
  monitor_url: url
  monitor_url_fallback: url?
  pair_code: str?
  pin: str?
  token: password?
  interval: int(30,3600)
  verify_ssl: bool
  certs:
    - str
