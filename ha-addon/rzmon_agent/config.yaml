name: RzMon Agent
version: "1.28.0"
slug: rzmon_agent
description: Stuurt CPU, RAM, diskruimte, add-on status, updates, back-ups, integraties, systeemstatus, poorten en certificaten van Home Assistant naar RzMon
url: https://github.com/rembrand20/rzmon
arch:
  - aarch64
  - amd64
  - armv7
init: false
startup: services
boot: auto
# Supervisor API: host-info, add-ons, updates (alleen lezen)
hassio_api: true
hassio_role: default
# Controleren of Home Assistant Core draait
homeassistant_api: true
# Nodig om de luisterende poorten van de host te zien
host_network: true
# Certificaten in /ssl (bv. van de Let's Encrypt- of DuckDNS-add-on) alleen lezen
map:
  - ssl
options:
  monitor_url: "http://192.168.1.10"
  token: ""
  interval: 60
  verify_ssl: true
  certs:
    - /ssl/fullchain.pem
schema:
  monitor_url: url
  token: password
  interval: int(30,3600)
  verify_ssl: bool
  certs:
    - str
