configuration:
  monitor_url:
    name: RzSense URL
    description: Adres van je RzSense-server, bv. http://192.168.1.10 of https://rzmon.mijndomein.nl
  monitor_url_fallback:
    name: Reserve-adres (optioneel)
    description: Gebruikt als het RzSense-adres niet bereikbaar is, bv. https via je reverse proxy met http://<LAN-IP> als reserve. RzSense meldt dat met een ⚠️. Het adres kun je ook in RzSense wijzigen (Agent Manager → 🌐 Adres van RzSense).
  pair_code:
    name: Koppelcode
    description: Koppelcode van deze server in RzSense (Agent Manager → 🔗 Koppelcode, 15 minuten geldig). De add-on haalt daarmee zijn eigen sleutel op; daarna mag het veld blijven staan of leeg.
  pin:
    name: Vingerafdruk certificaat
    description: Alleen bij een eigen (self-signed) certificaat van RzSense; staat bij de koppelcode. Dan accepteert de add-on alleen dat certificaat.
  token:
    name: Agent token (oude manier)
    description: Alleen nodig zonder koppelcode (agent ouder dan 1.50.0 of RzSense ouder dan 1.64.0).
  interval:
    name: Interval (seconden)
    description: Alleen voor oudere RzSense-versies. Vanaf RzSense 1.41.0 stel je de tik in RzSense in (Agent Manager → Rapporteren elke …).
  stats_interval:
    name: Statistieken per add-on (minuten)
    description: Hoe vaak de add-on CPU, geheugen en netwerk van Core, Supervisor en elke add-on ophaalt (standaard 5). Elke vraag kost de Supervisor ongeveer 2 seconden en een regel in zijn log. 1 = elke minuut, 0 = nooit (dan alleen of een add-on draait). Of een add-on draait, wordt altijd elke minuut gecontroleerd.
  verify_ssl:
    name: SSL-certificaat controleren
    description: Uitzetten als RzSense een self-signed certificaat gebruikt.
  certs:
    name: Certificaten
    description: Certificaten waarvan RzSense de vervaldatum bewaakt. Bestanden in /ssl (bv. /ssl/fullchain.pem) en/of host:poort, ook op internet (bv. homeassistant.local:8123 of mijndomein.duckdns.org:443).
