configuration:
  monitor_url:
    name: RzMon URL
    description: Address of your RzMon server, e.g. http://192.168.1.10 or https://rzmon.example.com
  token:
    name: Agent token
    description: Token of this host in RzMon (host of type "Remote met agent" → "Agent installeren").
  interval:
    name: Interval (seconds)
    description: How often the agent reports. RzMon marks checks CRITICAL when the agent stays silent for a few minutes.
  verify_ssl:
    name: Verify SSL certificate
    description: Disable when RzMon uses a self-signed certificate.
