configuration:
  monitor_url:
    name: RzMon URL
    description: Address of your RzMon server, e.g. http://192.168.1.10 or https://rzmon.example.com
  token:
    name: Agent token
    description: Token of this host in RzMon (host of type "Remote met agent" → "Agent installeren").
  interval:
    name: Interval (seconds)
    description: Only for older RzMon versions. From RzMon 1.41.0 you set the interval in RzMon (Agent Manager → Report every …).
  verify_ssl:
    name: Verify SSL certificate
    description: Disable when RzMon uses a self-signed certificate.
  certs:
    name: Certificates
    description: Certificates whose expiry date RzMon monitors. Files in /ssl (e.g. /ssl/fullchain.pem) and/or host:port, also on the internet (e.g. homeassistant.local:8123 or mydomain.duckdns.org:443).
