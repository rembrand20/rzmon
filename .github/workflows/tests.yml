name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # De agent op verschillende Linux-versies, elk met zijn eigen awk (mawk, gawk, busybox): is het rapport geldige JSON?
  agent:
    name: Agent op ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ['debian:12', 'debian:trixie', 'ubuntu:24.04', 'rockylinux:9', 'fedora:42', 'alpine:3.22']
    container: ${{ matrix.image }}
    steps:
      - name: Benodigdheden
        run: |
          if command -v apt-get >/dev/null; then apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq bash curl procps iproute2 python3 openssl ca-certificates git >/dev/null
          elif command -v dnf >/dev/null; then dnf install -y -q bash procps-ng iproute python3 openssl findutils git >/dev/null
          elif command -v apk >/dev/null; then apk add -q bash curl procps iproute2 python3 openssl coreutils git; fi
      - uses: actions/checkout@v4
      - name: Agent draaien en het rapport controleren
        shell: bash
        run: |
          set +e +o pipefail
          bash tests/agent-json.sh 2>&1 | tee /tmp/agent.out
          rc=${PIPESTATUS[0]}
          # Bij een fout de laatste regels ook als annotatie (zichtbaar in het overzicht van de run)
          [ "$rc" = 0 ] || { echo "::error title=Agent op ${{ matrix.image }}::$(tail -n 15 /tmp/agent.out | tr '\n' '|' | cut -c1-3000)"; exit 1; }
      - name: YARA-regels van RzMon compileren (Debian)
        if: matrix.image == 'debian:12'
        shell: bash
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq yara >/dev/null
          # De test-webshell wordt hier pas in elkaar gezet: als letterlijke tekst in de repo zien virusscanners
          # (Microsoft Defender: Backdoor:JS/Chopper) dit bestand zelf als webshell.
          f1=ev; f2=al; d1=base64; d2=_decode
          printf '<?php %s(%s($_POST["x"])); ?>' "$f1$f2" "$d1$d2" >/tmp/ws.php
          yara -w rules/yara/rzmon.yar /tmp/ws.php | grep -q rz_php_webshell_eval || { echo "::error title=YARA::regels compileren niet of vinden de test-webshell niet"; exit 1; }
          echo "✔ YARA-regels compileren en vinden de test-webshell"
      - name: Ransomware herkennen (lokaas, extensies, versleuteld, opruimen)
        shell: bash
        run: |
          set +e +o pipefail
          bash tests/agent-ransom.sh 2>&1 | tee /tmp/ransom.out
          rc=${PIPESTATUS[0]}
          [ "$rc" = 0 ] || { echo "::error title=Ransomware op ${{ matrix.image }}::$(tail -n 15 /tmp/ransom.out | tr '\n' '|' | cut -c1-3000)"; exit 1; }
      - name: Programma's en jagen (vingerafdruk, pakket, blokkeren, sporen)
        shell: bash
        run: |
          set +e +o pipefail
          bash tests/agent-apps.sh 2>&1 | tee /tmp/apps.out
          rc=${PIPESTATUS[0]}
          [ "$rc" = 0 ] || { echo "::error title=Programma's op ${{ matrix.image }}::$(tail -n 15 /tmp/apps.out | tr '\n' '|' | cut -c1-3000)"; exit 1; }
      - name: Updates (klaarstaand, beveiliging, installeren met snapshot)
        shell: bash
        run: |
          set +e +o pipefail
          bash tests/agent-patch.sh 2>&1 | tee /tmp/patch.out
          rc=${PIPESTATUS[0]}
          [ "$rc" = 0 ] || { echo "::error title=Updates op ${{ matrix.image }}::$(tail -n 15 /tmp/patch.out | tr '\n' '|' | cut -c1-3000)"; exit 1; }
      - name: Tijdelijk sudo (visudo, intrekken, nooit root)
        shell: bash
        run: |
          set +e +o pipefail
          bash tests/agent-sudo.sh 2>&1 | tee /tmp/sudo.out
          rc=${PIPESTATUS[0]}
          [ "$rc" = 0 ] || { echo "::error title=Tijdelijk sudo op ${{ matrix.image }}::$(tail -n 15 /tmp/sudo.out | tr '\n' '|' | cut -c1-3000)"; exit 1; }
      - name: Reverse proxy beschermen (nagebootste SWAG met nginx)
        shell: bash
        run: |
          set +e +o pipefail
          bash tests/agent-proxy.sh 2>&1 | tee /tmp/proxy.out
          rc=${PIPESTATUS[0]}
          [ "$rc" = 0 ] || { echo "::error title=Reverse proxy op ${{ matrix.image }}::$(tail -n 15 /tmp/proxy.out | tr '\n' '|' | cut -c1-3000)"; exit 1; }
      - name: WAF op de reverse proxy (nep-CrowdSec)
        shell: bash
        run: |
          set +e +o pipefail
          bash tests/agent-waf.sh 2>&1 | tee /tmp/waf.out
          rc=${PIPESTATUS[0]}
          [ "$rc" = 0 ] || { echo "::error title=WAF op ${{ matrix.image }}::$(tail -n 15 /tmp/waf.out | tr '\n' '|' | cut -c1-3000)"; exit 1; }
      - name: ClamAV op de reverse proxy (nep-ClamAV)
        shell: bash
        run: |
          set +e +o pipefail
          bash tests/agent-av.sh 2>&1 | tee /tmp/av.out
          rc=${PIPESTATUS[0]}
          [ "$rc" = 0 ] || { echo "::error title=ClamAV op ${{ matrix.image }}::$(tail -n 15 /tmp/av.out | tr '\n' '|' | cut -c1-3000)"; exit 1; }
      - name: Suricata op het proxynetwerk (nep-Suricata)
        shell: bash
        run: |
          set +e +o pipefail
          bash tests/agent-nids.sh 2>&1 | tee /tmp/nids.out
          rc=${PIPESTATUS[0]}
          [ "$rc" = 0 ] || { echo "::error title=Suricata op ${{ matrix.image }}::$(tail -n 15 /tmp/nids.out | tr '\n' '|' | cut -c1-3000)"; exit 1; }
      - name: Statistieken van de reverse proxy (telling uit het proxylog)
        shell: bash
        run: |
          set +e +o pipefail
          bash tests/agent-pxstat.sh 2>&1 | tee /tmp/pxstat.out
          rc=${PIPESTATUS[0]}
          [ "$rc" = 0 ] || { echo "::error title=Proxy-statistieken op ${{ matrix.image }}::$(tail -n 15 /tmp/pxstat.out | tr '\n' '|' | cut -c1-3000)"; exit 1; }
      - name: Endpoint-bewaking (auditd-, SWAG- en Suricata-parser)
        shell: bash
        run: |
          set +e +o pipefail
          bash tests/agent-edr.sh 2>&1 | tee /tmp/edr.out
          rc=${PIPESTATUS[0]}
          [ "$rc" = 0 ] || { echo "::error title=Endpoint-parsers op ${{ matrix.image }}::$(tail -n 15 /tmp/edr.out | tr '\n' '|' | cut -c1-3000)"; exit 1; }

  # PHP-tests met een echte MariaDB, daarna een rondje in de browser
  php:
    name: PHP en browser
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: rzmon
          MARIADB_USER: rzmon
          MARIADB_PASSWORD: rzmon-ci
        ports: ['3306:3306']
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, curl, mbstring, sodium, zip
      - name: config.php en database
        run: |
          cat > config.php <<'PHP'
          <?php
          return ['db' => ['host' => '127.0.0.1', 'port' => 3306, 'name' => 'rzmon', 'user' => 'rzmon', 'pass' => 'rzmon-ci'],
              'timezone' => 'Europe/Amsterdam', 'ping_bin' => '/bin/ping', 'base_url' => '', 'php' => ['display_errors' => '1']];
          PHP
          echo 'ci-geheim-123' | php install/install.php admin 2>&1 | tee /tmp/install.out
          grep -q 'Klaar!' /tmp/install.out || { echo "::error title=Installatie::$(tail -n 15 /tmp/install.out | tr '\n' '|' | cut -c1-3000)"; exit 1; }
      - name: PHP-tests
        run: |
          php tests/php/run.php 2>&1 | tee /tmp/php-tests.out
          [ "${PIPESTATUS[0]}" = 0 ] || { echo "::error title=PHP-tests::$(grep -E '✘|Fatal|Error' /tmp/php-tests.out | head -n 15 | tr '\n' '|' | cut -c1-3000)"; exit 1; }
      - name: Playwright-browser uit de cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.47.2-${{ runner.os }}
      - name: Browserrondje
        run: |
          (cd public && php -S 127.0.0.1:8099 >/tmp/php.log 2>&1 &)
          npm install --no-save --silent playwright@1.47.2
          npx playwright install --with-deps chromium >/dev/null
          BASE=http://127.0.0.1:8099 RZ_USER=admin RZ_PASS=ci-geheim-123 node tests/e2e/smoke.js 2>&1 | tee /tmp/e2e.out
          [ "${PIPESTATUS[0]}" = 0 ] || { echo "::error title=Browserrondje::$(tail -n 15 /tmp/e2e.out | tr '\n' '|' | cut -c1-3000) || php: $(tail -n 5 /tmp/php.log | tr '\n' '|')"; exit 1; }
      - name: PHP-log bij een fout
        if: failure()
        run: cat /tmp/php.log || true

  # 1.281.0: de container bouwen, met MariaDB opstarten (zoals de quadlets: host-netwerk) en het browserrondje erop
  container:
    name: Container (image + browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Image bouwen
        run: docker build -f container/Containerfile -t rzsense:ci .
      - name: MariaDB en RzSense starten
        run: |
          cat > /tmp/rz.env <<'ENV'
          MARIADB_DATABASE=rzmon
          MARIADB_USER=rzmon
          MARIADB_PASSWORD=ci-db-wachtwoord
          MARIADB_ROOT_PASSWORD=ci-root-wachtwoord
          RZMON_DB_HOST=127.0.0.1
          RZMON_DB_NAME=rzmon
          RZMON_DB_USER=rzmon
          RZMON_DB_PASS=ci-db-wachtwoord
          RZMON_ADMIN_PASS=ci-geheim-123
          RZMON_WEB_PORT=8080
          RZMON_DOOR_PORT=8443
          ENV
          docker run -d --name rzsense-db --network host --env-file /tmp/rz.env mariadb:11.4 --bind-address=127.0.0.1 --port=3306
          docker run -d --name rzsense --network host --cap-add NET_RAW --read-only --tmpfs /tmp:rw,size=256m,mode=1777 \
            --security-opt no-new-privileges --env-file /tmp/rz.env -v rzsense-data:/var/lib/rzmon rzsense:ci
          for i in $(seq 1 90); do curl -fsS http://127.0.0.1:8080/healthz.php >/dev/null 2>&1 && break; sleep 2; done
          curl -fsS http://127.0.0.1:8080/healthz.php || { docker logs rzsense; exit 1; }
          curl -fksS https://127.0.0.1:8443/healthz.php || { echo "::error title=Nooddeur::https op 8443 werkt niet"; docker logs rzsense; exit 1; }
          docker exec rzsense ping -c1 -W2 127.0.0.1 >/dev/null || { echo "::error title=Ping::ping werkt niet in de container"; exit 1; }
          docker exec rzsense id -un | grep -qx www-data || { echo "::error title=Gebruiker::de container draait niet als www-data"; exit 1; }
      - name: Playwright-browser uit de cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.47.2-${{ runner.os }}
      - name: Browserrondje tegen de container
        run: |
          npm install --no-save --silent playwright@1.47.2
          npx playwright install --with-deps chromium >/dev/null
          BASE=http://127.0.0.1:8080 RZ_USER=admin RZ_PASS=ci-geheim-123 node tests/e2e/smoke.js 2>&1 | tee /tmp/e2e.out
          [ "${PIPESTATUS[0]}" = 0 ] || { echo "::error title=Browserrondje (container)::$(tail -n 15 /tmp/e2e.out | tr '\n' '|' | cut -c1-3000)"; exit 1; }
      - name: Herstart (tweede start, zelfde versie) en logboek
        if: always()
        run: |
          docker restart rzsense >/dev/null && sleep 15 && curl -fsS http://127.0.0.1:8080/healthz.php || true
          docker logs rzsense 2>&1 | tail -n 40
