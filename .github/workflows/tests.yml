name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # De agent op verschillende Linux-versies, elk met zijn eigen awk (mawk, gawk, busybox): is het rapport geldige JSON?
  agent:
    name: Agent op ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ['debian:12', 'debian:trixie', 'ubuntu:24.04', 'rockylinux:9', 'fedora:42', 'alpine:3.22']
    container: ${{ matrix.image }}
    steps:
      - name: Benodigdheden
        run: |
          if command -v apt-get >/dev/null; then apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq bash curl procps iproute2 python3 openssl ca-certificates git >/dev/null
          elif command -v dnf >/dev/null; then dnf install -y -q bash procps-ng iproute python3 openssl findutils git >/dev/null
          elif command -v apk >/dev/null; then apk add -q bash curl procps iproute2 python3 openssl coreutils git; fi
      - uses: actions/checkout@v4
      - name: Agent draaien en het rapport controleren
        shell: bash
        run: |
          set +e +o pipefail
          bash tests/agent-json.sh 2>&1 | tee /tmp/agent.out
          rc=${PIPESTATUS[0]}
          # Bij een fout de laatste regels ook als annotatie (zichtbaar in het overzicht van de run)
          [ "$rc" = 0 ] || { echo "::error title=Agent op ${{ matrix.image }}::$(tail -n 15 /tmp/agent.out | tr '\n' '|' | cut -c1-3000)"; exit 1; }
      - name: YARA-regels van RzMon compileren (Debian)
        if: matrix.image == 'debian:12'
        shell: bash
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq yara >/dev/null
          # De test-webshell wordt hier pas in elkaar gezet: als letterlijke tekst in de repo zien virusscanners
          # (Microsoft Defender: Backdoor:JS/Chopper) dit bestand zelf als webshell.
          f1=ev; f2=al; d1=base64; d2=_decode
          printf '<?php %s(%s($_POST["x"])); ?>' "$f1$f2" "$d1$d2" >/tmp/ws.php
          yara -w rules/yara/rzmon.yar /tmp/ws.php | grep -q rz_php_webshell_eval || { echo "::error title=YARA::regels compileren niet of vinden de test-webshell niet"; exit 1; }
          echo "✔ YARA-regels compileren en vinden de test-webshell"
      - name: Ransomware herkennen (lokaas, extensies, versleuteld, opruimen)
        shell: bash
        run: |
          set +e +o pipefail
          bash tests/agent-ransom.sh 2>&1 | tee /tmp/ransom.out
          rc=${PIPESTATUS[0]}
          [ "$rc" = 0 ] || { echo "::error title=Ransomware op ${{ matrix.image }}::$(tail -n 15 /tmp/ransom.out | tr '\n' '|' | cut -c1-3000)"; exit 1; }
      - name: Programma's en jagen (vingerafdruk, pakket, blokkeren, sporen)
        shell: bash
        run: |
          set +e +o pipefail
          bash tests/agent-apps.sh 2>&1 | tee /tmp/apps.out
          rc=${PIPESTATUS[0]}
          [ "$rc" = 0 ] || { echo "::error title=Programma's op ${{ matrix.image }}::$(tail -n 15 /tmp/apps.out | tr '\n' '|' | cut -c1-3000)"; exit 1; }
      - name: Updates (klaarstaand, beveiliging, installeren met snapshot)
        shell: bash
        run: |
          set +e +o pipefail
          bash tests/agent-patch.sh 2>&1 | tee /tmp/patch.out
          rc=${PIPESTATUS[0]}
          [ "$rc" = 0 ] || { echo "::error title=Updates op ${{ matrix.image }}::$(tail -n 15 /tmp/patch.out | tr '\n' '|' | cut -c1-3000)"; exit 1; }
      - name: Tijdelijk sudo (visudo, intrekken, nooit root)
        shell: bash
        run: |
          set +e +o pipefail
          bash tests/agent-sudo.sh 2>&1 | tee /tmp/sudo.out
          rc=${PIPESTATUS[0]}
          [ "$rc" = 0 ] || { echo "::error title=Tijdelijk sudo op ${{ matrix.image }}::$(tail -n 15 /tmp/sudo.out | tr '\n' '|' | cut -c1-3000)"; exit 1; }
      - name: Reverse proxy beschermen (nagebootste SWAG met nginx)
        shell: bash
        run: |
          set +e +o pipefail
          bash tests/agent-proxy.sh 2>&1 | tee /tmp/proxy.out
          rc=${PIPESTATUS[0]}
          [ "$rc" = 0 ] || { echo "::error title=Reverse proxy op ${{ matrix.image }}::$(tail -n 15 /tmp/proxy.out | tr '\n' '|' | cut -c1-3000)"; exit 1; }
      - name: WAF op de reverse proxy (nep-CrowdSec)
        shell: bash
        run: |
          set +e +o pipefail
          bash tests/agent-waf.sh 2>&1 | tee /tmp/waf.out
          rc=${PIPESTATUS[0]}
          [ "$rc" = 0 ] || { echo "::error title=WAF op ${{ matrix.image }}::$(tail -n 15 /tmp/waf.out | tr '\n' '|' | cut -c1-3000)"; exit 1; }
      - name: ClamAV op de reverse proxy (nep-ClamAV)
        shell: bash
        run: |
          set +e +o pipefail
          bash tests/agent-av.sh 2>&1 | tee /tmp/av.out
          rc=${PIPESTATUS[0]}
          [ "$rc" = 0 ] || { echo "::error title=ClamAV op ${{ matrix.image }}::$(tail -n 15 /tmp/av.out | tr '\n' '|' | cut -c1-3000)"; exit 1; }
      - name: Suricata op het proxynetwerk (nep-Suricata)
        shell: bash
        run: |
          set +e +o pipefail
          bash tests/agent-nids.sh 2>&1 | tee /tmp/nids.out
          rc=${PIPESTATUS[0]}
          [ "$rc" = 0 ] || { echo "::error title=Suricata op ${{ matrix.image }}::$(tail -n 15 /tmp/nids.out | tr '\n' '|' | cut -c1-3000)"; exit 1; }
      - name: Statistieken van de reverse proxy (telling uit het proxylog)
        shell: bash
        run: |
          set +e +o pipefail
          bash tests/agent-pxstat.sh 2>&1 | tee /tmp/pxstat.out
          rc=${PIPESTATUS[0]}
          [ "$rc" = 0 ] || { echo "::error title=Proxy-statistieken op ${{ matrix.image }}::$(tail -n 15 /tmp/pxstat.out | tr '\n' '|' | cut -c1-3000)"; exit 1; }
      - name: Endpoint-bewaking (auditd-, SWAG- en Suricata-parser)
        shell: bash
        run: |
          set +e +o pipefail
          bash tests/agent-edr.sh 2>&1 | tee /tmp/edr.out
          rc=${PIPESTATUS[0]}
          [ "$rc" = 0 ] || { echo "::error title=Endpoint-parsers op ${{ matrix.image }}::$(tail -n 15 /tmp/edr.out | tr '\n' '|' | cut -c1-3000)"; exit 1; }

  # PHP-tests met een echte MariaDB, daarna een rondje in de browser
  php:
    name: PHP en browser
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: rzmon
          MARIADB_USER: rzmon
          MARIADB_PASSWORD: rzmon-ci
        ports: ['3306:3306']
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, curl, mbstring, sodium, zip
      - name: config.php en database
        run: |
          cat > config.php <<'PHP'
          <?php
          return ['db' => ['host' => '127.0.0.1', 'port' => 3306, 'name' => 'rzmon', 'user' => 'rzmon', 'pass' => 'rzmon-ci'],
              'timezone' => 'Europe/Amsterdam', 'ping_bin' => '/bin/ping', 'base_url' => '', 'php' => ['display_errors' => '1']];
          PHP
          echo 'ci-geheim-123' | php install/install.php admin 2>&1 | tee /tmp/install.out
          grep -q 'Klaar!' /tmp/install.out || { echo "::error title=Installatie::$(tail -n 15 /tmp/install.out | tr '\n' '|' | cut -c1-3000)"; exit 1; }
      - name: PHP-tests
        run: |
          php tests/php/run.php 2>&1 | tee /tmp/php-tests.out
          [ "${PIPESTATUS[0]}" = 0 ] || { echo "::error title=PHP-tests::$(grep -E '✘|Fatal|Error' /tmp/php-tests.out | head -n 15 | tr '\n' '|' | cut -c1-3000)"; exit 1; }
      - name: Playwright-browser uit de cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.47.2-${{ runner.os }}
      - name: Browserrondje
        run: |
          (cd public && php -S 127.0.0.1:8099 >/tmp/php.log 2>&1 &)
          # 1.288.2: de cron draait mee, zoals in een echte installatie (live updates tijdens het rondje vingen zo een fout)
          (for i in $(seq 1 60); do php cron/run.php >>/tmp/cron.log 2>&1; sleep 15; done &)
          npm install --no-save --silent playwright@1.47.2
          npx playwright install --with-deps chromium >/dev/null
          BASE=http://127.0.0.1:8099 RZ_USER=admin RZ_PASS=ci-geheim-123 node tests/e2e/smoke.js 2>&1 | tee /tmp/e2e.out
          [ "${PIPESTATUS[0]}" = 0 ] || { echo "::error title=Browserrondje::$(tail -n 15 /tmp/e2e.out | tr '\n' '|' | cut -c1-3000) || php: $(tail -n 5 /tmp/php.log | tr '\n' '|')"; exit 1; }
      - name: PHP-log bij een fout
        if: failure()
        run: cat /tmp/php.log || true

  # 1.281.0: de container bouwen, met MariaDB opstarten (zoals de quadlets: host-netwerk) en het browserrondje erop
  container:
    name: Container (image + browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Image bouwen
        run: docker build -f container/Containerfile -t rzsense:ci .
      - name: MariaDB en RzSense starten
        run: |
          cat > /tmp/rz.env <<'ENV'
          MARIADB_DATABASE=rzmon
          MARIADB_USER=rzmon
          MARIADB_PASSWORD=ci-db-wachtwoord
          MARIADB_ROOT_PASSWORD=ci-root-wachtwoord
          RZMON_DB_HOST=127.0.0.1
          RZMON_DB_NAME=rzmon
          RZMON_DB_USER=rzmon
          RZMON_DB_PASS=ci-db-wachtwoord
          RZMON_ADMIN_PASS=ci-geheim-123
          RZMON_WEB_PORT=8080
          RZMON_DOOR_PORT=8443
          ENV
          docker run -d --name rzsense-db --network host --env-file /tmp/rz.env mariadb:11.4 --bind-address=127.0.0.1 --port=3306
          docker run -d --name rzsense --network host --cap-add NET_RAW --read-only --tmpfs /tmp:rw,size=256m,mode=1777 \
            --security-opt no-new-privileges --env-file /tmp/rz.env -v rzsense-data:/var/lib/rzmon rzsense:ci
          for i in $(seq 1 90); do curl -fsS http://127.0.0.1:8080/healthz.php >/dev/null 2>&1 && break; sleep 2; done
          curl -fsS http://127.0.0.1:8080/healthz.php || { docker logs rzsense; exit 1; }
          curl -fksS https://127.0.0.1:8443/healthz.php || { echo "::error title=Nooddeur::https op 8443 werkt niet"; docker logs rzsense; exit 1; }
          docker exec rzsense ping -c1 -W2 127.0.0.1 >/dev/null || { echo "::error title=Ping::ping werkt niet in de container"; exit 1; }
          docker exec rzsense id -un | grep -qx www-data || { echo "::error title=Gebruiker::de container draait niet als www-data"; exit 1; }
      - name: Playwright-browser uit de cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.47.2-${{ runner.os }}
      - name: Browserrondje tegen de container
        run: |
          npm install --no-save --silent playwright@1.47.2
          npx playwright install --with-deps chromium >/dev/null
          BASE=http://127.0.0.1:8080 RZ_USER=admin RZ_PASS=ci-geheim-123 node tests/e2e/smoke.js 2>&1 | tee /tmp/e2e.out
          [ "${PIPESTATUS[0]}" = 0 ] || { echo "::error title=Browserrondje (container)::$(tail -n 15 /tmp/e2e.out | tr '\n' '|' | cut -c1-3000)"; exit 1; }
      - name: Relay (1.282.0) - agent, relay en RzSense in containers
        run: |
          docker build -f relay/Containerfile -t rzsense-relay:ci .
          rz() { docker exec rzsense php -r "require '/opt/rzsense/src/bootstrap.php'; $1"; }
          fail() { echo "::error title=Relay::$1"; docker logs rzsense-relay 2>&1 | tail -n 30; exit 1; }
          read -r RID CODE < <(rz '$id = Relay::create("ci-relay", "ci"); $p = AgentCrypto::pairCreate($id); echo $id, " ", $p["code"], "\n";')
          docker run -d --name rzsense-relay --network host --cap-add NET_RAW --read-only --tmpfs /tmp:rw,size=64m,mode=1777 \
            --security-opt no-new-privileges -e MONITOR_URL=http://127.0.0.1:8080 -e PAIR_CODE="$CODE" -e RELAY_TICK=10 \
            -v relay-data:/data rzsense-relay:ci
          # 1. de relay koppelt en meldt het certificaat
          PIN=""
          for i in $(seq 1 40); do PIN=$(rz "echo Relay::pin($RID);"); [ -n "$PIN" ] && break; sleep 3; done
          [ -n "$PIN" ] || fail "de relay meldt zich niet bij RzSense"
          docker exec rzsense-relay id -un | grep -qx rzrelay || fail "de relay draait niet als rzrelay"
          rcode() { curl -s -o /dev/null -w '%{http_code}' -k --pinnedpubkey "sha256//$PIN" "https://127.0.0.1:8444/api.php?action=$1"; }
          # 2. zonder netwerk weigert de relay alles; daarna alleen agentverkeer
          [ "$(rcode ping)" = 403 ] || fail "zonder netwerk niet geweigerd"
          rz "Relay::saveNetwork(['name' => 'CI', 'cidrs' => '127.0.0.0/8', 'relay_id' => $RID], 'ci'); Relay::saveRelay($RID, ['url' => 'https://127.0.0.1:8444', 'port' => 8444], 'ci');"
          for i in $(seq 1 40); do [ "$(rcode ping)" = 200 ] && break; sleep 3; done
          [ "$(rcode ping)" = 200 ] || fail "met netwerk geen doorgang"
          [ "$(rcode state)" = 404 ] || fail "niet-agentverkeer werd doorgestuurd"
          # 3. een agent koppelt en rapporteert via de relay
          read -r AID CODE2 < <(rz 'q("INSERT INTO hosts (name, address, mode, enabled) VALUES (\"ci-achter\", \"127.0.0.1\", \"agent\", 1)"); $id = (int) db()->lastInsertId(); $p = AgentCrypto::pairCreate($id); echo $id, " ", $p["code"], "\n";')
          mkdir -p /tmp/ach
          AGENT_DIR=/tmp/ach CACHE_DIRECTORY=/tmp/ach/cache REMOTE_UPDATE=0 MONITOR_URL=https://127.0.0.1:8444 PIN="$PIN" PAIR_CODE="$CODE2" \
            bash agent/rzmon-agent.sh >/tmp/ach.log 2>&1 || true
          v=$(rz "echo q('SELECT CONCAT(IFNULL(relay_via, 0), \" \", IF(agent_seen IS NULL, 0, 1), \" \", agent_key_seen) FROM hosts WHERE id = $AID')->fetchColumn();")
          [ "$v" = "$RID 1 1" ] || { tail -n 20 /tmp/ach.log; fail "agent achter de relay: $v (verwacht: $RID 1 1)"; }
          echo "✔ agent → relay → RzSense: gekoppeld en gerapporteerd via relay $RID"
          docker logs rzsense-relay 2>&1 | tail -n 8

      - name: Relay in de ophaalmodus (1.292.0) - RzSense haalt op, de relay belt nooit zelf
        run: |
          rz() { docker exec rzsense php -r "require '/opt/rzsense/src/bootstrap.php'; $1"; }
          fail() { echo "::error title=Relay (ophalen)::$1"; docker logs rzsense-relay-pull 2>&1 | tail -n 30; rz "print_r(q('SELECT name, relay_pull_err, relay_pull_at FROM hosts WHERE relay_pull = 1')->fetchAll());"; exit 1; }
          read -r RID CODE KEY < <(rz '$id = Relay::create("ci-dmz", "ci", null, ["pull_url" => "https://127.0.0.1:8455", "pull_every" => 5]); $p = AgentCrypto::pairCreate($id); $k = RelayPull::installInfo($id); echo $id, " ", $p["code"], " ", $k["pull_key"], "\n";')
          # Geen MONITOR_URL: de relay kent RzSense niet en belt niet naar buiten
          docker run -d --name rzsense-relay-pull --network host --read-only --tmpfs /tmp:rw,size=64m,mode=1777 \
            --security-opt no-new-privileges -e RELAY_PULL_KEY="$KEY" -e PAIR_CODE="$CODE" -e RELAY_PORT=8454 -e RELAY_PULL_PORT=8455 -e RELAY_TICK=10 \
            -v relay-pull-data:/data rzsense-relay:ci
          # 1. RzSense haalt op (de planner start elke minuut de ophaallus): de relay koppelt en meldt zich
          PIN=""
          for i in $(seq 1 60); do PIN=$(rz "echo Relay::pin($RID);"); [ -n "$PIN" ] && break; sleep 3; done
          [ -n "$PIN" ] || fail "de relay koppelt niet via ophalen"
          # 2. zonder handtekening geeft het ophaalpunt niets
          [ "$(curl -sk -o /dev/null -w '%{http_code}' -X POST https://127.0.0.1:8455/rz/pull)" = 401 ] || fail "ophaalpunt zonder handtekening niet geweigerd"
          # 3. een agent achter de relay koppelt en rapporteert (het antwoord komt één ronde later)
          read -r AID CODE2 < <(rz 'q("INSERT INTO hosts (name, address, mode, enabled) VALUES (\"ci-dmz-web\", \"127.0.0.1\", \"agent\", 1)"); $id = (int) db()->lastInsertId(); $p = AgentCrypto::pairCreate($id); echo $id, " ", $p["code"], "\n";')
          mkdir -p /tmp/achp
          v=""
          for i in $(seq 1 15); do
            AGENT_DIR=/tmp/achp CACHE_DIRECTORY=/tmp/achp/cache REMOTE_UPDATE=0 RZ_FORCE=1 RZ_NO_BEAT=1 MONITOR_URL=https://127.0.0.1:8454 PIN="$PIN" PAIR_CODE="$CODE2" \
              bash agent/rzmon-agent.sh >/tmp/achp.log 2>&1 || true
            v=$(rz "echo q('SELECT CONCAT(IFNULL(relay_via, 0), \" \", IF(agent_seen IS NULL, 0, 1), \" \", agent_key_seen) FROM hosts WHERE id = $AID')->fetchColumn();")
            [ "$v" = "$RID 1 1" ] && break
            sleep 10
          done
          [ "$v" = "$RID 1 1" ] || { tail -n 20 /tmp/achp.log; fail "agent achter de relay (ophalen): $v (verwacht: $RID 1 1)"; }
          echo "✔ agent → relay ← RzSense haalt op: gekoppeld en gerapporteerd via relay $RID"
          docker logs rzsense-relay-pull 2>&1 | grep -v 'in de wachtrij' | tail -n 8

      - name: Losse relay-agent (1.283.0) - rzmon-agent-relay met systemd
        run: |
          rz() { docker exec rzsense php -r "require '/opt/rzsense/src/bootstrap.php'; $1"; }
          fail() { echo "::error title=Losse relay-agent::$1"; sudo journalctl -u rzmon-agent-relay -n 30 --no-pager || true; sudo tail -n 20 /var/lib/rzmon-agent-relay/agent-last.log || true; exit 1; }
          read -r RID CODE < <(rz '$id = Relay::create("ci-relay-agent", "ci"); $p = AgentCrypto::pairCreate($id); echo $id, " ", $p["code"], "\n";')
          # Uit deze map (de handtekeningen maakt GitHub pas na de push): installeren zoals het commando uit RzSense
          sudo bash agent/install-relay.sh --src "$PWD" --url http://127.0.0.1:8080 --pair "$CODE" --port 8446 --yes
          systemctl is-active --quiet rzmon-agent-relay || fail "de dienst draait niet"
          [ "$(systemctl show -p User --value rzmon-agent-relay)" = rzrelay ] || fail "de dienst draait niet als rzrelay"
          PIN=""
          for i in $(seq 1 40); do PIN=$(rz "echo Relay::pin($RID);"); [ -n "$PIN" ] && break; sleep 3; done
          [ -n "$PIN" ] || fail "de losse relay-agent meldt zich niet"
          [ "$(rz "echo q('SELECT relay_kind FROM hosts WHERE id = $RID')->fetchColumn();")" = agent ] || fail "soort is niet 'agent'"
          ps -o user= -C python3 | grep -qx rzrelay || fail "relay.py draait niet als rzrelay"
          # Doorsturen: netwerk, adres, en een agent die via deze relay koppelt en rapporteert
          rz "Relay::saveNetwork(['name' => 'CI2', 'cidrs' => '127.0.0.0/8', 'relay_id' => $RID], 'ci'); Relay::saveRelay($RID, ['url' => 'https://127.0.0.1:8446', 'port' => 8446], 'ci');"
          rcode() { curl -s -o /dev/null -w '%{http_code}' -k --pinnedpubkey "sha256//$PIN" "https://127.0.0.1:8446/api.php?action=$1"; }
          for i in $(seq 1 40); do [ "$(rcode ping)" = 200 ] && break; sleep 3; done
          [ "$(rcode ping)" = 200 ] || fail "geen doorgang via de losse relay-agent"
          read -r AID CODE2 < <(rz 'q("INSERT INTO hosts (name, address, mode, enabled) VALUES (\"ci-achter2\", \"127.0.0.1\", \"agent\", 1)"); $id = (int) db()->lastInsertId(); $p = AgentCrypto::pairCreate($id); echo $id, " ", $p["code"], "\n";')
          mkdir -p /tmp/ach2
          AGENT_DIR=/tmp/ach2 CACHE_DIRECTORY=/tmp/ach2/cache REMOTE_UPDATE=0 MONITOR_URL=https://127.0.0.1:8446 PIN="$PIN" PAIR_CODE="$CODE2" \
            bash agent/rzmon-agent.sh >/tmp/ach2.log 2>&1 || true
          [ "$(rz "echo q('SELECT relay_via FROM hosts WHERE id = $AID')->fetchColumn();")" = "$RID" ] || { tail -n 20 /tmp/ach2.log; fail "agent kwam niet via de losse relay-agent binnen"; }
          # Bijwerken: knop in RzSense → de relay zet een verzoek neer → de root-dienst installeert (hier zonder handtekening: die maakt GitHub pas na de push)
          echo 'UPDATE_UNSIGNED="1"' | sudo tee -a /etc/default/rzmon-agent-relay >/dev/null
          rz "q('UPDATE hosts SET agent_update_req = NOW(), agent_update_sent = NULL WHERE id = $RID');"
          st=""
          for i in $(seq 1 60); do st=$(rz "echo q('SELECT agent_update_status FROM hosts WHERE id = $RID')->fetchColumn();"); case "$st" in ✔*|✘*) break ;; esac; sleep 3; done
          case "$st" in ✔*) echo "✔ bijwerken via de root-dienst: $st" ;; *) sudo journalctl -u rzmon-agent-relay-update -n 20 --no-pager || true; fail "bijwerken: $st" ;; esac
          sudo rzmon-agent-relay-setup --status
          # Verwijderen
          sudo rzmon-agent-relay-setup --uninstall -y
          ! systemctl is-active --quiet rzmon-agent-relay || fail "de dienst draait nog na verwijderen"
          [ ! -e /opt/rzmon-agent-relay ] && ! id rzrelay >/dev/null 2>&1 || fail "verwijderen liet iets achter"
          echo "✔ losse relay-agent: installeren, koppelen, doorsturen, bijwerken en verwijderen"

      - name: Herstart (tweede start, zelfde versie) en logboek
        if: always()
        run: |
          docker restart rzsense >/dev/null && sleep 15 && curl -fsS http://127.0.0.1:8080/healthz.php || true
          docker logs rzsense 2>&1 | tail -n 40
