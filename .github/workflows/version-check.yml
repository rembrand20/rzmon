name: Versiecontrole

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Versienummers (RzMon en agent) en changelogs
        run: bash tools/check-version.sh
      - name: Syntaxcontrole shellscripts
        run: |
          for f in agent/*.sh install/*.sh tools/*.sh tests/*.sh ha-addon/rzmon_agent/*.sh; do bash -n "$f"; done
      - name: Syntaxcontrole PHP
        run: |
          for f in $(git ls-files '*.php'); do php -l "$f" >/dev/null; done
      - name: Syntaxcontrole JavaScript
        run: |
          for f in public/assets/*.js; do node --check "$f"; done
      - name: Shellcheck (gebouwde agent en scripts)
        run: |
          command -v shellcheck >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck >/dev/null; }
          shellcheck -S warning agent/rzmon-agent.sh agent/install-agent.sh ha-addon/rzmon_agent/*.sh tools/*.sh
