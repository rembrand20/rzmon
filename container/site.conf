# De site zelf (zelfde regels als de Apache-vhost van install-rocky.sh). Ingevoegd voor de gewone poort en de nooddeur.
root @APP@/public;
index index.php;
autoindex off;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "same-origin" always;

# Let's Encrypt (1.358.0): de controlebestanden voor het aanvragen en vernieuwen (vóór de regel hieronder: ^~ gaat voor)
location ^~ /.well-known/acme-challenge/ {
    root @DATA@/acme;
    default_type text/plain;
    try_files $uri =404;
}

# Verborgen bestanden nooit
location ~ /\. { deny all; return 404; }

# Bestanden van de interface: 30 dagen in de browser (versienummer in de URL)
location ~* ^/assets/.*\.(js|css|svg|png|woff2|json)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
}

location / {
    try_files $uri $uri/ =404;
}

# PHP, ook met een pad erachter (REST API: /v1.php/status), en Authorization doorgeven
location ~ ^(.+\.php)(/.*)?$ {
    fastcgi_split_path_info ^(.+\.php)(/.*)$;
    try_files $fastcgi_script_name =404;
    include /etc/nginx/fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param PATH_INFO $fastcgi_path_info;
    fastcgi_param HTTP_AUTHORIZATION $http_authorization;
    fastcgi_param HTTPS $https if_not_empty;
    fastcgi_read_timeout 300s;
    fastcgi_pass unix:/tmp/rzsense-fpm.sock;
}
