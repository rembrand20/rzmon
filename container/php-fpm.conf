; RzSense in een container (1.281.0): één pool, als www-data, op een unix-socket in /tmp
; (geen TCP-poort: met network_mode host zou poort 9000 kunnen botsen met de host).
[global]
error_log = /proc/self/fd/2
daemonize = no

[rzsense]
listen = /tmp/rzsense-fpm.sock
listen.mode = 0660
pm = dynamic
pm.max_children = 12
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 500
; RZMON_CONTAINER, RZMON_CONFIG en de poorten doorgeven aan PHP (wachtwoorden zijn dan al uit de omgeving gehaald)
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
